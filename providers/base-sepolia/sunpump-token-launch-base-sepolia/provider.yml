name: sunpump-token-launch-base-sepolia
title: "SunPump Token Launch (Base Sepolia)"
description: "Configured SunPump launch route; upstream POST currently returns 405"
category: finance
version: v1

forward_url: https://sunpump.meme

display:
  service_url: https://x402-gateway.bankofai.io/providers/sunpump-token-launch-base-sepolia
  tags: ["sunpump", "token-launch", "base", "base-sepolia"]

discovery:
  use_case: "Inspect the configured SunPump x402 route on Base Sepolia while the upstream launch API is unavailable."
  spend_aware_usage:
    - "Use a low fixed Base Sepolia USDC payment per request."
  when_to_use:
    - "Payment-route integration checks while SunPump upstream POST returns 405"
  request_examples:
    - "POST /providers/sunpump-token-launch-base-sepolia/pump-api/ai/agentTokenLaunch"

routing:
  type: proxy

operator:
  network: eip155:84532
  currencies:
    usd: ["USDC"]
  recipient: "0x7bac3352Bc5F342DcaFA573749aA4502CB12dA86"
  scheme: exact
  protocol: exact
  facilitator_url: https://x402.org/facilitator
  valid_for_seconds: 300

endpoints:
  - method: POST
    path: /pump-api/ai/agentTokenLaunch
    description: "Configured SunPump launch route; upstream POST currently returns 405"
    metering:
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.000001
