name: goplus-token-security-base-sepolia
title: "GoPlus Token Security (Base Sepolia)"
description: "Token and address security data from GoPlus"
category: security
version: v1

forward_url: https://api.gopluslabs.io

display:
  service_url: https://x402-gateway.bankofai.io/providers/goplus-token-security-base-sepolia
  tags: ["goplus", "security", "tokens"]

discovery:
  use_case: "Use GoPlus Token Security through x402 on Base Sepolia."
  spend_aware_usage:
    - "Use a low fixed Base Sepolia USDC payment per request."
  when_to_use:
    - "Token and address security data from GoPlus"
  request_examples:
    - "GET /providers/goplus-token-security-base-sepolia/api/v1/token_security/{chain_id}"
    - "GET /providers/goplus-token-security-base-sepolia/api/v1/address_security/{address}"
    - "GET /providers/goplus-token-security-base-sepolia/api/v2/token_approval_security/{chain_id}?addresses={address}"

routing:
  type: proxy

operator:
  network: eip155:84532
  currencies:
    usd: ["USDC"]
  recipient: "0x7bac3352Bc5F342DcaFA573749aA4502CB12dA86"
  scheme: exact
  protocol: exact
  facilitator_url: https://x402.org/facilitator
  valid_for_seconds: 300

endpoints:
  - method: GET
    path: /api/v1/token_security/{chain_id}
    description: "Token security report"
    metering:
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.000001
  - method: GET
    path: /api/v1/address_security/{address}
    description: "Address security report"
    metering:
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.000001
  - method: GET
    path: /api/v2/token_approval_security/{chain_id}
    description: "Token approval security report"
    metering:
      dimensions:
        - direction: usage
          unit: requests
          scale: 1
          tiers:
            - price_usd: 0.000001
